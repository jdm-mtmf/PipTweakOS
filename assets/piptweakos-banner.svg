<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="340" shape-rendering="crispEdges">
  <defs>
    <style>
      .ascii { font-family: 'Courier New', Courier, monospace; font-weight: bold; white-space: pre; }
      .title { font-family: 'Courier New', Courier, monospace; font-weight: 900; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- 8-Bit Sunset Sky Bands (Prairie Sunset Gradient in Pixel Bands) -->
  <rect x="0" y="0" width="960" height="36" fill="#2b0938"/>
  <rect x="0" y="36" width="960" height="36" fill="#591254"/>
  <rect x="0" y="72" width="960" height="36" fill="#941f57"/>
  <rect x="0" y="108" width="960" height="36" fill="#c93843"/>
  <rect x="0" y="144" width="960" height="36" fill="#ec662c"/>
  <rect x="0" y="180" width="960" height="36" fill="#f9a12eff"/>
  <rect x="0" y="216" width="960" height="34" fill="#ffd95a"/>

  <!-- 8-Bit Dithered Sunset Scanlines -->
  <rect x="0" y="32" width="960" height="4" fill="#591254"/>
  <rect x="0" y="68" width="960" height="4" fill="#941f57"/>
  <rect x="0" y="104" width="960" height="4" fill="#c93843"/>
  <rect x="0" y="140" width="960" height="4" fill="#ec662c"/>
  <rect x="0" y="176" width="960" height="4" fill="#f9a12e"/>
  <rect x="0" y="212" width="960" height="4" fill="#ffd95a"/>

