  <polygon points="0,250 40,226 110,226 140,250" fill="#4a1c31"/>
  <polygon points="480,250 510,218 580,218 610,234 650,234 675,250" fill="#4a1c31"/>
  <polygon points="820,250 850,210 920,210 960,250" fill="#4a1c31"/>

  <!-- Prairie Field Ground Layers -->
  <rect x="0" y="250" width="960" height="24" fill="#5e3a18"/>
  <rect x="0" y="274" width="960" height="30" fill="#3d2610"/>
  <rect x="0" y="304" width="960" height="36" fill="#241508"/>

  <!-- ASCII Prairie Grass & Wheat Stalks across Horizon -->
  <text x="16" y="266" fill="#f9a12e" font-size="15" class="ascii">\|/  v  \|/   ~   \|/    v   \|/   ~   \|/  v  \|/   ~   \|/   v   \|/   ~   \|/  v  \|/   ~   \|/  v  \|/</text>
  <text x="10" y="292" fill="#d48522" font-size="14" class="ascii">~  \|/   ~   \|/  v   ~  \|/   v   ~   \|/   ~  \|/   v   ~  \|/   ~  \|/   v   ~   \|/  v  ~  \|/   ~  \|/</text>
  <text x="24" y="322" fill="#8f5716" font-size="14" class="ascii">v   ~   \|/   ~   v   \|/   ~   v   \|/   ~   v   \|/   ~   v   \|/   ~   v   \|/   ~   v   \|/   ~   v</text>

  <!-- 8-Bit Cowboy Mouse with Corncob Pipe & Cheeky Grin (Left Side) -->
  <!-- Smoke puffs from corncob pipe -->
  <rect x="332" y="56" width="16" height="12" fill="#f4e6f7" opacity="0.8"/>
  <rect x="348" y="40" width="24" height="14" fill="#f4e6f7" opacity="0.65"/>
  <rect x="368" y="22" width="28" height="14" fill="#f4e6f7" opacity="0.45"/>

