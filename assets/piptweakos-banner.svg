  <rect x="640" y="104" width="140" height="16" fill="#ffe875"/>
  <rect x="616" y="120" width="188" height="24" fill="#ffdf59"/>
  <rect x="600" y="144" width="220" height="32" fill="#ffd23f"/>
  <rect x="592" y="176" width="236" height="40" fill="#ffbe26"/>
  <rect x="592" y="216" width="236" height="34" fill="#ffa812"/>

