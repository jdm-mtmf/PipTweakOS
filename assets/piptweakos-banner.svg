  <rect x="264" y="156" width="48" height="10" fill="#d4a017"/> <!-- Corncob Shank -->
  <rect x="308" y="120" width="36" height="46" fill="#f5c71a"/> <!-- Golden Corncob Bowl -->
  <rect x="314" y="128" width="8" height="8" fill="#c68b12"/> <!-- Cob Kernel Texture -->
  <rect x="328" y="128" width="8" height="8" fill="#c68b12"/>
  <rect x="320" y="142" width="8" height="8" fill="#c68b12"/>
  <rect x="314" y="152" width="8" height="8" fill="#c68b12"/>
  <rect x="328" y="152" width="8" height="8" fill="#c68b12"/>
  <rect x="312" y="114" width="28" height="6" fill="#ff4500"/> <!-- Glowing Ember -->

  <!-- Red Bandana & Sheriffs Vest Torso -->
  <polygon points="116,200 240,200 178,236" fill="#d9381e"/>
  <rect x="124" y="208" width="108" height="42" fill="#6e4720"/>
  <rect x="200" y="218" width="14" height="14" fill="#ffd700"/> <!-- Gold Sheriff Star -->

  <!-- PipTweakOS Title & Subtitle Banner (Right Side) -->
  <text x="384" y="102" fill="#241508" font-size="60" class="title">PipTweakOS</text>
  <text x="380" y="98" fill="#ffe875" font-size="60" class="title">PipTweakOS</text>
  <text x="382" y="138" fill="#ffd95a" font-size="18" class="ascii">8-BIT PRAIRIE GRIT FOR POCKET-SIZED ANDROID IRON</text>
  <text x="382" y="168" fill="#ffffff" font-size="14" class="ascii">[ TARGET: SOYES XS18 PRO / TIGERS TIS001_S4 ]</text>
  <text x="382" y="192" fill="#ffe875" font-size="14" class="ascii">[ STATUS: ROOTKITS ROPED • ZRAM TAMED • 900mAh HONEST ]</text>
</svg>
