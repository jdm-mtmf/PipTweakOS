  <rect x="128" y="114" width="28" height="6" fill="#241508"/> <!-- Raised Cheeky Eyebrow -->
  <rect x="132" y="126" width="20" height="20" fill="#1a1110"/>
  <rect x="142" y="128" width="8" height="8" fill="#ffffff"/> <!-- Eye Glint -->
  <rect x="200" y="118" width="28" height="6" fill="#241510"/>
  <rect x="204" y="126" width="20" height="20" fill="#1a1110"/>
  <rect x="214" y="128" width="8" height="8" fill="#ffffff"/> <!-- Eye Glint -->

  <!-- Pink Nose & Whiskers -->
  <rect x="170" y="148" width="18" height="12" fill="#ff6b8b"/>
  <rect x="72" y="150" width="36" height="4" fill="#241508"/>
  <rect x="68" y="162" width="40" height="4" fill="#241508"/>
  <rect x="248" y="150" width="36" height="4" fill="#241508"/>
  <rect x="248" y="162" width="40" height="4" fill="#241508"/>

  <!-- Big Cheeky Lopsided Grin with Buck Teeth -->
  <rect x="132" y="172" width="88" height="8" fill="#241508"/>
  <rect x="124" y="164" width="10" height="10" fill="#241508"/> <!-- Left Smirk Corner -->
  <rect x="218" y="160" width="12" height="14" fill="#241508"/> <!-- High Cheeky Right Smirk -->
  <rect x="164" y="180" width="12" height="12" fill="#ffffff"/> <!-- Left Buck Tooth -->
  <rect x="178" y="180" width="12" height="12" fill="#ffffff"/> <!-- Right Buck Tooth -->

  <!-- Corncob Pipe Clenched in Cheeky Grin -->
