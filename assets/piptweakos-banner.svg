  <rect x="76" y="84" width="44" height="44" fill="#7c8594"/>
  <rect x="84" y="92" width="28" height="28" fill="#eba0ac"/>
  <rect x="236" y="84" width="44" height="44" fill="#7c8594"/>
  <rect x="244" y="92" width="28" height="28" fill="#eba0ac"/>

  <!-- 8-Bit Cowboy Hat (Crown, Crease, Hatband, Wide Brim) -->
  <rect x="124" y="44" width="40" height="12" fill="#8b4513"/>
  <rect x="192" y="44" width="40" height="12" fill="#8b4513"/>
  <rect x="116" y="56" width="124" height="24" fill="#a0522d"/>
  <rect x="116" y="80" width="124" height="10" fill="#d9381e"/> <!-- Red Sheriff Hatband -->
  <rect x="172" y="80" width="12" height="10" fill="#ffd700"/> <!-- Gold Buckle -->
